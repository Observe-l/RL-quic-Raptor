env: "quicfec"
runner: "episode"  # single env; our wrapper runs one episode per step

env_args:
  rtt_ms: 100
  loss_pct: 10
  # Select loss model; overrides loss_pct when set.
  # Examples: "iid:10" or "gemodel:0.5,20,80,0.1"
  loss_mode: "iid:10"
  bitrate_mbps: 10
  K: 40
  symbol_bytes: 1200
  prefer_local: False  # use shaped netns/tc path (requires sudo)
  episode_steps: 100   # steps per episode per experiment design
  phase: "train"      # one of {train, val, test}
  scenario_family: "auto"  # A, B, C, or auto

test_greedy: True
test_nepisode: 2
test_interval: 100
log_interval: 100
runner_log_interval: 50
learner_log_interval: 50
t_max: 300  # short sanity run
