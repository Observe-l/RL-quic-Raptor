env: "quicfec"
runner: "episode"  # single env; our wrapper runs one episode per step

env_args:
  rtt_ms: 100
  loss_pct: 5
  bitrate_mbps: 10
  K: 40
  symbol_bytes: 1200
  prefer_local: True  # use sudo-free localhost path by default for training sanity checks

test_greedy: True
test_nepisode: 2
test_interval: 100
log_interval: 100
runner_log_interval: 50
learner_log_interval: 50
t_max: 300  # short sanity run
