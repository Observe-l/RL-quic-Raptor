[General]
network = RSUExampleScenario
scheduler-class = "cRealTimeScheduler"
sim-time-limit = 300s
debug-on-errors = true
print-undisposed = true
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 5s
**.cmdenv-log-level = info

**.scalar-recording = true
**.vector-recording = false
**.statistic-recording = true
output-scalar-file = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/veins.sca"
output-vector-file = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/veins.vec"

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m
*.annotations.draw = false
*.obstacles.obstacles = xmldoc("../scenario/config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("../scenario/period12.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"
*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3
*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType = "org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"

*.rsu[0].mobility.x = 2400
*.rsu[0].mobility.y = 1578
*.rsu[0].mobility.z = 3
*.rsu[*].applType = "veins_cosim.QuicFecBridgeApp"
*.rsu[*].appl.isRSU = true
*.rsu[*].appl.periodicBeaconing = false
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.headerLength = 0bit
*.rsu[*].appl.dataLengthBits = 0bit
*.rsu[*].appl.bridgePortBase = 41000
*.rsu[*].appl.rsuBridgePort = 40999
*.rsu[*].appl.pollInterval = 1ms
*.rsu[*].appl.serverBin = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/bin/quicfec-veins-server"
*.rsu[*].appl.receiveDir = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/received"
*.rsu[*].appl.logDir = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/logs"
*.rsu[*].appl.serverOptions = "-timeout 360s -rx-workers 2 -decode-ddl 25ms"
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0m

*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 12Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("../scenario/config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("../scenario/config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("../scenario/antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895m

*.node[*].applType = "veins_cosim.QuicFecBridgeApp"
*.node[*].appl.isRSU = false
*.node[*].appl.periodicBeaconing = true
*.node[*].appl.beaconInterval = 0.02s
*.node[*].appl.headerLength = 64bit
*.node[*].appl.dataLengthBits = 5280bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconUserPriority = 7
*.node[*].appl.dataUserPriority = 5
*.node[*].appl.bridgePortBase = 41000
*.node[*].appl.rsuBridgePort = 40999
*.node[*].appl.pollInterval = 1ms
*.node[*].appl.clientBin = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/bin/quicfec-veins-client"
*.node[*].appl.clientInputDir = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/input"
*.node[*].appl.logDir = "/home/lwh/Documents/Code/RL-quic-Raptor/veins_cosim/results/period12_100KiB/logs"
*.node[*].appl.clientOptions = "-timeout 120s -connect-timeout 45s -N 32 -K 26 -L 1200 -arq -R0 6 -W 8 -Rstep 4 -max-attempts 5 -ack-every 8"

*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

